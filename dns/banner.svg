<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
<defs><style>
.bg{fill:#030810}.grid{stroke:#0d1f35;stroke-width:.8;fill:none}
.title{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;fill:#f0f6fc;letter-spacing:-.5px}
.sub{font-family:"Segoe UI",system-ui,sans-serif;fill:#8b949e}
.num{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;fill:#f0f6fc}
.lbl{font-family:"Segoe UI",system-ui,sans-serif;fill:#8b949e;font-size:11px}
.tag{font-family:"Consolas","Courier New",monospace;fill:#8b949e;font-size:10px}
.mono{font-family:"Consolas","Courier New",monospace;fill:#da3633}
.dot-r{fill:#da3633}.dot-g{fill:#3fb950}
@keyframes sweep{0%{transform:translateY(-40px);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(300px);opacity:0}}
.scanline{animation:sweep 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{r:3;opacity:.9}50%{r:5.5;opacity:.4}}
@keyframes pulse2{0%,100%{r:2.5;opacity:.8}50%{r:4.5;opacity:.35}}
.p1{animation:pulse 2s ease-in-out infinite}
.p2{animation:pulse2 2.4s ease-in-out infinite .4s}
.p3{animation:pulse 2.8s ease-in-out infinite .8s}
.p4{animation:pulse2 2.2s ease-in-out infinite 1.2s}
.p5{animation:pulse 3s ease-in-out infinite .6s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.s1{animation:fadein .6s ease both .1s}.s2{animation:fadein .6s ease both .4s}
.s3{animation:fadein .6s ease both .7s}.s4{animation:fadein .6s ease both 1s}
.s5{animation:fadein .6s ease both 1.3s}.s6{animation:fadein .6s ease both 1.6s}
@keyframes titlein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.ta{animation:titlein .7s ease both .05s}.tb{animation:titlein .7s ease both .25s}
.tc{animation:fadein .6s ease both .5s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cursor{animation:blink 1s step-end infinite}
@keyframes arc{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.a1{stroke-dasharray:400;animation:arc 2.2s ease both .3s}
.a2{stroke-dasharray:350;animation:arc 2.2s ease both .6s}
.a3{stroke-dasharray:300;animation:arc 2.2s ease both .9s}
.a4{stroke-dasharray:280;animation:arc 2.2s ease both .5s}
.a5{stroke-dasharray:260;animation:arc 2.2s ease both .8s}
.a6{stroke-dasharray:320;animation:arc 2.2s ease both 1.1s}
@keyframes glw{0%,100%{filter:drop-shadow(0 0 6px #da3633)}50%{filter:drop-shadow(0 0 18px #da3633)}}
.origin{animation:glw 2.5s ease-in-out infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.radar{transform-origin:1050px 185px;animation:spin 4s linear infinite}
</style>
<filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#da3633" stop-opacity="0"/><stop offset=".5" stop-color="#da3633" stop-opacity=".4"/><stop offset="1" stop-color="#da3633" stop-opacity="0"/></linearGradient>
<clipPath id="mc"><rect x="650" y="20" width="620" height="330"/></clipPath>
</defs>
<rect width="1280" height="360" class="bg"/>
<g class="grid">
<line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/>
<line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/><line x1="560" y1="0" x2="560" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/><line x1="720" y1="0" x2="720" y2="360"/><line x1="800" y1="0" x2="800" y2="360"/><line x1="880" y1="0" x2="880" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/><line x1="1040" y1="0" x2="1040" y2="360"/><line x1="1120" y1="0" x2="1120" y2="360"/><line x1="1200" y1="0" x2="1200" y2="360"/>
</g>
<rect x="0" y="0" width="4" height="360" fill="#da3633"/>
<rect class="scanline" x="40" y="0" width="570" height="10" fill="url(#sg)" rx="3"/>
<line x1="645" y1="0" x2="645" y2="360" stroke="#162030" stroke-width="1.5"/>

<!-- Right: DNS radar visualization -->
<g clip-path="url(#mc)">
  <ellipse cx="1050" cy="185" rx="50" ry="50" fill="#da3633" opacity=".15" filter="url(#blur6)"/>
  <!-- Radar rings -->
  <circle cx="1050" cy="185" r="120" fill="none" stroke="#da3633" stroke-width=".6" opacity=".12"/>
  <circle cx="1050" cy="185" r="85" fill="none" stroke="#da3633" stroke-width=".8" opacity=".18"/>
  <circle cx="1050" cy="185" r="50" fill="none" stroke="#da3633" stroke-width="1" opacity=".28"/>
  <!-- Radar sweep line -->
  <line class="radar" x1="1050" y1="185" x2="1050" y2="65" stroke="#da3633" stroke-width="1.5" opacity=".6"/>
  <!-- Origin -->
  <circle cx="1050" cy="185" r="6" fill="#da3633" class="p1 origin"/>
  <circle cx="1050" cy="185" r="14" fill="none" stroke="#da3633" stroke-width="1" opacity=".3"/>
  <!-- DNS resolution lines -->
  <path class="a1" fill="none" stroke="#da3633" stroke-width="1.4" d="M1050 185 Q950 100 840 130"/>
  <path class="a2" fill="none" stroke="#da3633" stroke-width="1.2" d="M1050 185 Q900 80 770 140"/>
  <path class="a3" fill="none" stroke="#3fb950" stroke-width="1" d="M1050 185 Q970 110 890 145"/>
  <path class="a4" fill="none" stroke="#da3633" stroke-width="1.3" d="M1050 185 Q960 260 840 235"/>
  <path class="a5" fill="none" stroke="#3fb950" stroke-width="1" d="M1050 185 Q980 270 910 255"/>
  <path class="a6" fill="none" stroke="#da3633" stroke-width="1.1" d="M1050 185 Q860 130 730 165"/>
  <!-- Endpoint dots -->
  <circle cx="840" cy="130" r="3.5" class="dot-r p2"/>
  <circle cx="770" cy="140" r="3" class="dot-r p3"/>
  <circle cx="890" cy="145" r="3" class="dot-g p4"/>
  <circle cx="840" cy="235" r="3.5" class="dot-r p5"/>
  <circle cx="910" cy="255" r="3" class="dot-g p2"/>
  <circle cx="730" cy="165" r="2.5" class="dot-r p3"/>
</g>

<!-- Left: content -->
<text class="tag s1" x="48" y="34" font-size="10">PHISHDESTROY · DNS INTELLIGENCE · REAL-TIME VALIDATION</text>
<text class="title ta" x="48" y="92" font-size="42">DNS Intelligence</text>
<text class="sub tc" x="48" y="120" font-size="13">Active domain tracking · Multi-resolver validation · 24h cycle</text>
<rect x="48" y="130" width="540" height="1" fill="#162030" class="s1"/>

<!-- Stats -->
<g class="s2"><text class="num" x="48" y="170" font-size="32">165,855</text><text class="lbl" x="48" y="186">PRIMARY DOMAINS</text></g>
<g class="s3"><text class="num" x="270" y="170" font-size="32">100</text><text class="lbl" x="270" y="186">DNS THREADS</text></g>
<g class="s4"><text class="num" x="390" y="170" font-size="32">24h</text><text class="lbl" x="390" y="186">CYCLE</text></g>

<!-- DNS record type bars -->
<g class="s3"><text class="tag" x="48" y="220">A / AAAA</text><rect x="48" y="223" width="180" height="5" rx="2" fill="#da3633"/><text class="tag" x="240" y="228">IPv4 · IPv6</text></g>
<g class="s4"><text class="tag" x="48" y="244">MX</text><rect x="48" y="247" width="130" height="5" rx="2" fill="#da3633" opacity=".7"/><text class="tag" x="240" y="252">Mail Exchange</text></g>
<g class="s5"><text class="tag" x="48" y="268">NS</text><rect x="48" y="271" width="100" height="5" rx="2" fill="#da3633" opacity=".55"/><text class="tag" x="240" y="276">Nameservers</text></g>
<g class="s5"><text class="tag" x="48" y="292">CNAME</text><rect x="48" y="295" width="70" height="5" rx="2" fill="#3fb950" opacity=".7"/><text class="tag" x="240" y="300">Aliases</text></g>
<g class="s6"><text class="tag" x="48" y="316">STATUS</text><rect x="48" y="319" width="50" height="5" rx="2" fill="#3fb950"/><text class="mono cursor" x="240" y="324" font-size="11">ACTIVE_</text></g>

<rect x="0" y="348" width="1280" height="12" fill="#060d18"/>
<text class="tag" x="48" y="358" font-size="9">active_domains.json · dead_domains.json · content_active.json · dns_cache.json</text>
<text class="tag" x="1240" y="358" font-size="9" text-anchor="end">github.com/phishdestroy/destroylist</text>
</svg>
