<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadein_r { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:translateX(0); } }
      @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.2; } }
      @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
      @keyframes scanline { from{ transform:translateY(-20px); } to{ transform:translateY(240px); } }
      @keyframes arc1 { from{ stroke-dashoffset:566; } to{ stroke-dashoffset:0; } }
      @keyframes arc2 { from{ stroke-dashoffset:440; } to{ stroke-dashoffset:0; } }
      @keyframes glow { 0%,100%{ opacity:1; } 50%{ opacity:0.7; } }
      .fi0{ animation:fadein 0.7s ease 0.10s; }
      .fi1{ animation:fadein 0.7s ease 0.30s; }
      .fi2{ animation:fadein 0.7s ease 0.50s; }
      .fi3{ animation:fadein 0.7s ease 0.65s; }
      .fr1{ animation:fadein_r 0.6s ease 0.70s; }
      .fr2{ animation:fadein_r 0.6s ease 0.90s; }
      .p0{ animation:pulse 2.5s ease-in-out infinite 0.0s; }
      .p1{ animation:pulse 2.5s ease-in-out infinite 0.8s; }
      .p2{ animation:pulse 2.5s ease-in-out infinite 1.6s; }
      .cur{ animation:blink 1s step-end infinite; }
      .scan{ animation:scanline 4s linear infinite 1s; }
      .a1{ animation:arc1 2s ease-out 0.2s; }
      .a2{ animation:arc2 2.5s ease-out 0.5s; }
      .bar{ animation:glow 3s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030810"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect width="900" height="220" rx="8"/></clipPath>
  </defs>

  <rect width="900" height="220" rx="8" fill="url(#bg)"/>
  <g clip-path="url(#cp)">
    <g stroke="#0d1f35" stroke-width="1">
      <line x1="90"  y1="0" x2="90"  y2="220"/>
      <line x1="180" y1="0" x2="180" y2="220"/>
      <line x1="270" y1="0" x2="270" y2="220"/>
      <line x1="360" y1="0" x2="360" y2="220"/>
      <line x1="450" y1="0" x2="450" y2="220"/>
      <line x1="540" y1="0" x2="540" y2="220"/>
      <line x1="630" y1="0" x2="630" y2="220"/>
      <line x1="720" y1="0" x2="720" y2="220"/>
      <line x1="810" y1="0" x2="810" y2="220"/>
      <line x1="0" y1="55"  x2="900" y2="55"/>
      <line x1="0" y1="110" x2="900" y2="110"/>
      <line x1="0" y1="165" x2="900" y2="165"/>
    </g>
    <circle class="a1" cx="870" cy="110" r="90" fill="none" stroke="#CC0000" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="566" stroke-dashoffset="566"/>
    <circle class="a2" cx="870" cy="110" r="65" fill="none" stroke="#CC0000" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="440" stroke-dashoffset="440"/>
    <rect class="scan" x="0" y="-20" width="900" height="20" fill="url(#sg)"/>
    <rect class="bar" x="0" y="0" width="5" height="220" fill="#CC0000"/>
    <circle class="p0" cx="26" cy="55"  r="3" fill="#CC0000"/>
    <circle class="p1" cx="26" cy="110" r="3" fill="#CC0000"/>
    <circle class="p2" cx="26" cy="165" r="3" fill="#CC0000"/>
    <text class="fi0" x="50" y="75" font-family="monospace" font-size="11" fill="#CC0000" letter-spacing="4">PHISHDESTROY</text>
    <text class="fi1" x="50" y="125" font-family="monospace" font-size="34" font-weight="bold" fill="#dde8f5" letter-spacing="2">FORMATS</text>
    <text class="fi2" x="50" y="155" font-family="monospace" font-size="13" fill="#6a8aaa" letter-spacing="3">BLOCKLIST CONFIGS</text>
    <text class="fi3" x="50" y="190" font-family="monospace" font-size="10" fill="#3a5570" letter-spacing="2">PHISHDESTROY THREAT INTELLIGENCE<tspan class="cur" fill="#CC0000">_</tspan></text>
    <line x1="510" y1="20" x2="510" y2="200" stroke="#1a3050" stroke-width="1"/>
    <g class="fr1">
      <text x="530" y="82" font-family="monospace" font-size="9" fill="#CC0000" letter-spacing="2">PLATFORMS</text>
      <text x="530" y="118" font-family="monospace" font-size="24" font-weight="bold" fill="#dde8f5">PI-HOLE · UNBOUND</text>
    </g>
    <g class="fr2">
      <text x="530" y="150" font-family="monospace" font-size="9" fill="#CC0000" letter-spacing="2">ALSO</text>
      <text x="530" y="186" font-family="monospace" font-size="24" font-weight="bold" fill="#dde8f5">DNSMASQ · RPZ · ADBLOCK</text>
    </g>
  </g>
</svg>