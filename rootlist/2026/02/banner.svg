<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030810"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <clipPath id="cp">
      <rect width="900" height="220" rx="8"/>
    </clipPath>
    <style>
      @keyframes fadein {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadein_right {
        from { opacity: 0; transform: translateX(8px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse {
        0%,100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%     { opacity: 0; }
      }
      @keyframes scanline {
        from { transform: translateY(-20px); }
        to   { transform: translateY(240px); }
      }
      @keyframes arc1draw {
        from { stroke-dashoffset: 565.49; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes arc2draw {
        from { stroke-dashoffset: 408.41; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes glow {
        0%,100% { opacity: 1; }
        50%     { opacity: 0.7; }
      }
      .fi0  { animation: fadein 0.7s ease  0.1s; }
      .fi1  { animation: fadein 0.7s ease  0.3s; }
      .fi2  { animation: fadein 0.7s ease  0.45s; }
      .fi3  { animation: fadein 0.7s ease  0.6s; }
      .fir1 { animation: fadein_right 0.7s ease  0.7s; }
      .fir2 { animation: fadein_right 0.7s ease  0.9s; }
      .p0   { animation: pulse 2.5s ease-in-out infinite 0s; }
      .p1   { animation: pulse 2.5s ease-in-out infinite 0.8s; }
      .p2   { animation: pulse 2.5s ease-in-out infinite 1.6s; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="8" fill="url(#bg)"/>

  <g clip-path="url(#cp)">

    <!-- Grid vertical lines -->
    <line x1="90"  y1="0" x2="90"  y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="270" y1="0" x2="270" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="510" y1="0" x2="510" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="630" y1="0" x2="630" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="220" stroke="#0d1f35" stroke-width="1"/>
    <line x1="810" y1="0" x2="810" y2="220" stroke="#0d1f35" stroke-width="1"/>

    <!-- Grid horizontal lines -->
    <line x1="0" y1="55"  x2="900" y2="55"  stroke="#0d1f35" stroke-width="1"/>
    <line x1="0" y1="110" x2="900" y2="110" stroke="#0d1f35" stroke-width="1"/>
    <line x1="0" y1="165" x2="900" y2="165" stroke="#0d1f35" stroke-width="1"/>

    <!-- Red left bar with glow animation -->
    <rect x="0" y="0" width="5" height="220" fill="#CC0000"
          style="animation: glow 3s ease-in-out infinite;"/>

    <!-- Pulse dots -->
    <circle cx="26" cy="55"  r="3" fill="#CC0000" class="p0"/>
    <circle cx="26" cy="110" r="3" fill="#CC0000" class="p1"/>
    <circle cx="26" cy="165" r="3" fill="#CC0000" class="p2"/>

    <!-- Animated arcs at (870,110) -->
    <circle cx="870" cy="110" r="90"
            fill="none" stroke="#CC0000" stroke-opacity="0.22" stroke-width="1.5"
            stroke-dasharray="565.49" stroke-dashoffset="565.49"
            style="animation: arc1draw 2s ease-out  0.5s;"/>
    <circle cx="870" cy="110" r="65"
            fill="none" stroke="#CC0000" stroke-opacity="0.14" stroke-width="1"
            stroke-dasharray="408.41" stroke-dashoffset="408.41"
            style="animation: arc2draw 2s ease-out  0.7s;"/>

    <!-- Scanline sweep -->
    <rect x="0" y="-20" width="900" height="20" fill="#4488cc" opacity="0.04"
          style="animation: scanline 4s linear infinite;"/>

    <!-- LEFT PANEL -->
    <!-- PHISHDESTROY label -->
    <text x="50" y="80" font-family="monospace" font-size="11" fill="#CC0000"
          letter-spacing="4" class="fi0">PHISHDESTROY</text>

    <!-- Month name -->
    <text x="50" y="120" font-family="monospace" font-size="38" font-weight="bold"
          fill="#dde8f5" letter-spacing="3" class="fi1">FEBRUARY</text>

    <!-- Year -->
    <text x="50" y="148" font-family="monospace" font-size="22"
          fill="#6a8aaa" letter-spacing="4" class="fi2">2026</text>

    <!-- Subtitle with blinking cursor -->
    <text x="50" y="170" font-family="monospace" font-size="10"
          fill="#3a5570" letter-spacing="2" class="fi3">THREAT INTELLIGENCE REPORT<tspan class="cursor">_</tspan></text>

    <!-- SEPARATOR LINE -->
    <line x1="510" y1="20" x2="510" y2="200" stroke="#1a3050" stroke-width="1"/>

    <!-- RIGHT PANEL -->
    <!-- Block 1: Domains Detected -->
    <g class="fir1">
      <text x="530" y="82" font-family="monospace" font-size="9"
            fill="#CC0000" letter-spacing="2">DOMAINS DETECTED</text>
      <text x="530" y="118" font-family="monospace" font-size="30" font-weight="bold"
            fill="#dde8f5">18,207</text>
    </g>

    <!-- Block 2: Kill Rate -->
    <g class="fir2">
      <text x="530" y="150" font-family="monospace" font-size="9"
            fill="#CC0000" letter-spacing="2">KILL RATE</text>
      <text x="530" y="186" font-family="monospace" font-size="30" font-weight="bold"
            fill="#dde8f5">19.0%</text>
    </g>

  </g>
</svg>