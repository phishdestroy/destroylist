name: Scheduled Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: repo-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild latest main and push with compare-and-swap retries
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          for i in {1..5}; do
            if ! git fetch origin main; then
              echo "Fetch attempt $i failed, retrying in $((i * 3))s..."
              sleep $((i * 3))
              continue
            fi
            git reset --hard origin/main

            # Recompute every generated file from the current branch head.
            # Reapplying a tarball from a stale attempt can silently overwrite
            # a newer list.json after a concurrent daemon commit.
            python scripts/validate_json.py
            python scripts/smart_aggregator.py
            python scripts/validate_and_clean.py
            python scripts/validate_json.py
            python scripts/update_counts.py
            python scripts/json_to_txt.py
            python scripts/build_rootlist.py
            python scripts/build_shards.py

            ADD_PATHS="list.json list.txt count.json \
                   community/blocklist.json community/blocklist.txt \
                   community/dead_blocklist.json \
                   community/live_blocklist.json community/live_blocklist.txt \
                   community/content_live.json community/content_live.txt \
                   community/count.json community/live_count.json \
                   community/content_active_count.json \
                   community/state.json community/commit_message.txt \
                   dns/*.json dns/*.txt rootlist/"

            git add $ADD_PATHS

            if git diff --staged --quiet; then
              echo "Changes already present in remote"
              exit 0
            fi

            # diff --stat counts every domain once per generated format;
            # report the real list.json delta instead.
            SUMMARY=$(python - <<'PY'
          import json
          import subprocess

          before = set(json.loads(subprocess.check_output(["git", "show", "HEAD:list.json"])))
          with open("list.json", encoding="utf-8") as source:
              after = set(json.load(source))
          print(f"+{len(after - before):,} added, -{len(before - after):,} purged, {len(after):,} total")
          PY
            )
            git commit -m "Daily update: ${SUMMARY} [skip ci]"
            git push && exit 0

            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          exit 1
