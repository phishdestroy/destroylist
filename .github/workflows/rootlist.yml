name: Scheduled Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: repo-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild latest main and push with compare-and-swap retries
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          for i in {1..5}; do
            if ! git fetch origin main; then
              echo "Fetch attempt $i failed, retrying in $((i * 3))s..."
              sleep $((i * 3))
              continue
            fi
            git reset --hard origin/main

            # Recompute every generated file from the current branch head.
            # Reapplying a tarball from a stale attempt can silently overwrite
            # a newer list.json after a concurrent daemon commit.
            python scripts/validate_json.py
            python scripts/smart_aggregator.py
            python scripts/validate_and_clean.py
            python scripts/validate_json.py
            python scripts/update_counts.py
            python scripts/json_to_txt.py
            python scripts/build_rootlist.py
            python scripts/build_shards.py

            ADD_PATHS="list.json list.txt count.json \
                   community/blocklist.json community/blocklist.txt \
                   community/dead_blocklist.json \
                   community/live_blocklist.json community/live_blocklist.txt \
                   community/content_live.json community/content_live.txt \
                   community/count.json community/live_count.json \
                   community/content_active_count.json \
                   community/state.json community/commit_message.txt \
                   dns/*.json dns/*.txt rootlist/"

            git add $ADD_PATHS

            if git diff --staged --quiet; then
              echo "Changes already present in remote"
              exit 0
            fi

            CHANGES=$(git diff --staged --stat | tail -1)
            git commit -m "Daily update: ${CHANGES} [skip ci]"
            git push && exit 0

            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          exit 1

      - name: Mirror to Codeberg
        continue-on-error: true
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "::error::CODEBERG_TOKEN is not configured"
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BRANCH="${GITHUB_REF_NAME}"
          git remote add codeberg "https://phishdestroy:${CODEBERG_TOKEN}@codeberg.org/phishdestroy/${REPO_NAME}.git"
          git push codeberg "HEAD:refs/heads/${BRANCH}"
