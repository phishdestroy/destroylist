name: On List Update
on:
  push:
    paths:
      - "list.json"
      - "dns/active_domains.json"
      - "dns/content_active.json"
      - "community/blocklist.json"
      - "community/live_blocklist.json"
      - "community/content_live.json"
    branches:
      - main
  workflow_dispatch:

jobs:
  process:
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    concurrency:
      group: repo-updates
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild latest main and push with compare-and-swap retries
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          for i in {1..5}; do
            if ! git fetch origin main; then
              echo "Fetch attempt $i failed, retrying in $((i * 3))s..."
              sleep $((i * 3))
              continue
            fi
            git reset --hard origin/main

            # Always rebuild from the newest branch head. Restoring outputs
            # produced from an older checkout can erase a concurrent list
            # update even when the eventual git push is a fast-forward.
            python scripts/validate_json.py
            python scripts/validate_and_clean.py
            python scripts/json_to_txt.py
            python scripts/update_counts.py
            python scripts/build_rootlist.py
            python scripts/build_shards.py

            # Source and every generated consumer must land in one commit.
            # Otherwise formats/rootlists can advertise domains that no
            # longer exist in the authoritative source files.
            git add list.json list.txt count.json \
                   community/blocklist.json community/blocklist.txt \
                   community/dead_blocklist.json \
                   community/live_blocklist.json community/live_blocklist.txt \
                   community/content_live.json community/content_live.txt \
                   community/count.json community/live_count.json \
                   community/content_active_count.json \
                   dns/*.json dns/*.txt rootlist/

            if git diff --staged --quiet; then
              echo "Changes already present in remote"
              exit 0
            fi

            git commit -m "Update processed files [skip ci]"
            git push && exit 0

            WAIT=$(( RANDOM % 10 + i * 3 ))
            echo "Push attempt $i failed, retrying in ${WAIT}s..."
            sleep $WAIT
          done
          exit 1
