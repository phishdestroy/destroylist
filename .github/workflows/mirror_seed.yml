name: Mirror Seed (one-off)
# Completes the one-time full seed of the fresh Codeberg mirror over SSH
# (Codeberg's HTTP gateway 504s long pushes). Delete this workflow afterwards.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Seed mirror over SSH
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then echo "::error::CODEBERG_TOKEN missing"; exit 1; fi
          AUTH="Authorization: token ${CODEBERG_TOKEN}"
          API="https://codeberg.org/api/v1"

          ssh-keygen -t ed25519 -f /tmp/cbkey -N "" -C "mirror-seed-tmp" -q
          PUB=$(cat /tmp/cbkey.pub)
          KEYID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"title\":\"mirror-seed-tmp\",\"key\":\"$PUB\"}" "$API/user/keys" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          [ -n "$KEYID" ] || { echo "::error::key registration failed"; exit 1; }
          echo "temp key registered: $KEYID"
          cleanup() { curl -s -X DELETE -H "$AUTH" "$API/user/keys/$KEYID" >/dev/null; echo "temp key removed"; }
          trap cleanup EXIT

          export GIT_SSH_COMMAND="ssh -i /tmp/cbkey -o StrictHostKeyChecking=accept-new"
          git remote add codeberg "git@codeberg.org:phishdestroy/destroylist.git"

          push_ref() {
            local ref=$1
            for a in 1 2 3; do
              if git push codeberg "$ref"; then return 0; fi
              echo "push attempt $a failed, retrying in $((a*20))s"; sleep $((a*20))
            done
            return 1
          }

          # mid-history checkpoint then full head (SSH has no gateway timeout,
          # chunks are just belt-and-braces)
          MID=$(git rev-list --reverse HEAD | sed -n '24000p')
          [ -n "$MID" ] && push_ref "+${MID}:refs/heads/main"
          push_ref "+HEAD:refs/heads/main" || { echo "::error::final push failed"; exit 1; }
          git push codeberg --tags --force || echo "tags push failed (non-fatal)"
          echo "MIRROR SEEDED"
