name: Mirror Seed (one-off)
# One-time full push of the slimmed history to Codeberg. Regular mirror steps
# do cheap shallow pushes once this has run. Delete this workflow afterwards.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Seed Codeberg mirror in chunks
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then echo "::error::CODEBERG_TOKEN missing"; exit 1; fi
          git config http.postBuffer 1610612736
          git config http.version HTTP/1.1
          git remote add codeberg "https://phishdestroy:${CODEBERG_TOKEN}@codeberg.org/phishdestroy/destroylist.git"

          TOTAL=$(git rev-list --count HEAD)
          echo "total commits: $TOTAL"
          git rev-list --reverse HEAD > /tmp/revs.txt

          push_ref() {
            local sha=$1
            for a in 1 2 3; do
              if git push codeberg "+${sha}:refs/heads/main"; then return 0; fi
              echo "push attempt $a failed for $sha, retrying in $((a*10))s"; sleep $((a*10))
            done
            return 1
          }

          for pos in 8000 16000 24000 32000 38000 40000 41000 41500; do
            SHA=$(sed -n "${pos}p" /tmp/revs.txt)
            [ -z "$SHA" ] && continue
            echo "=== chunk at commit #$pos ($SHA) ==="
            push_ref "$SHA" || { echo "::error::chunk $pos failed"; exit 1; }
          done

          echo "=== final HEAD ==="
          push_ref "$(git rev-parse HEAD)" || { echo "::error::final push failed"; exit 1; }
          git push codeberg --tags --force || echo "tags push failed (non-fatal)"
          echo "MIRROR SEEDED"
