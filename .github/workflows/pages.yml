name: Deploy GitHub Pages

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Jekyll configuration is kept out of the repository root
      - name: Jekyll configuration
        run: cp .github/pages/_config.yml _config.yml
      # Monthly reports page: data built from rootlist/YYYY/MM on every deploy
      - name: Monthly reports data
        run: python3 scripts/monthly-reports/build_data.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # robots.txt and sitemap.xml live in scripts/meta/ but are served from the site root
      - name: Publish metadata files at the site root
        run: sudo cp scripts/meta/* _site/
      - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
