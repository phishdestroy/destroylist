name: Update Statistics
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
concurrency:
  group: stats-updates
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Calculate statistics
        run: python scripts/calculate_stats.py
      - name: Rotate old archives to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Full-dump snapshots >32MB are not indexed by GitHub code search
          # (arrays shards handle searchability), so only the current month
          # stays in the tree; older snapshots move to the permanent Release.
          gh release view archives >/dev/null 2>&1 || \
            gh release create archives --title "Historical archives" \
              --notes "Weekly and monthly full-list snapshots rotated out of the working tree. Current month lives in archives/."
          rotate() {
            dir=$1; keep=$2
            ls "$dir"/*.json 2>/dev/null | sort | head -n -"$keep" | while read -r f; do
              echo "Rotating $f to Release"
              gh release upload archives "$f" --clobber || { echo "Upload failed for $f, keeping in tree"; continue; }
              git rm -q "$f"
            done
          }
          rotate archives/weekly 4
          rotate archives/monthly 1
          # Regenerate release notes with an up-to-date asset table
          cat > /tmp/release_notes.md <<'NOTES'
          ## 📦 Historical full-list snapshots

          Complete point-in-time dumps of both blocklists, rotated out of the
          working tree to keep the repository slim.

          - **Weekly** `YYYY-Www.json` — captured every Monday (UTC)
          - **Monthly** `YYYY-MM.json` — captured on the 1st (UTC)
          - The most recent snapshots stay in [`archives/`](https://github.com/OWNER_REPO/tree/main/archives)
          - Daily added/removed diffs (searchable in GitHub code search) live in [`changes/`](https://github.com/OWNER_REPO/tree/main/changes)

          Each snapshot is a single JSON object:

          ```json
          {
            "date": "YYYY-MM-DD",
            "primary_count": 188820,
            "community_count": 993697,
            "primary_domains": ["..."],
            "community_domains": ["..."]
          }
          ```

          **Check a domain against a historical state:**

          ```bash
          curl -sL https://github.com/OWNER_REPO/releases/download/archives/2026-06.json \
            | jq -r '.primary_domains[]' | grep -x 'suspicious-domain.com'
          ```
          NOTES
          sed -i 's|OWNER_REPO|'"${GITHUB_REPOSITORY}"'|g' /tmp/release_notes.md
          {
            echo
            echo "### Monthly snapshots"
            echo
            echo "| Snapshot | Size |"
            echo "|---|---|"
            gh release view archives --json assets \
              --jq '.assets[] | select(.name | test("W") | not) | "| \(.name) | \((.size / 104857.6 | floor) / 10) MB |"' | sort
            echo
            echo "### Weekly snapshots"
            echo
            echo "| Snapshot | Size |"
            echo "|---|---|"
            gh release view archives --json assets \
              --jq '.assets[] | select(.name | test("W")) | "| \(.name) | \((.size / 104857.6 | floor) / 10) MB |"' | sort
          } >> /tmp/release_notes.md
          gh release edit archives --notes-file /tmp/release_notes.md || echo "notes update failed, continuing"
      - name: Monitor repository size
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIZE_KB=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.size')
          SIZE_GB=$((SIZE_KB / 1048576))
          echo "Repository size: ${SIZE_GB} GB (${SIZE_KB} KB)"
          if [ "$SIZE_GB" -ge 10 ]; then
            echo "::warning::Repository has grown to ${SIZE_GB} GB — run the 'History Maintenance' workflow to slim git history"
          fi

      - name: Update daily gist
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python scripts/update_gist.py
      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dns/*.json archives/ changes/ dns/stats_snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update statistics [skip ci]"
          for i in {1..5}; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          exit 1
