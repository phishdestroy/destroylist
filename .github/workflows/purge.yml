name: Purge Domain
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to remove from all lists (added to allowlist automatically)"
        required: false
        default: ""
        type: string
  push:
    paths:
      - "allow/allowlist.json"
    branches:
      - main

jobs:
  purge:
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    concurrency:
      group: repo-updates
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate and push with compare-and-swap retries
        env:
          INPUT_DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if [ -n "$INPUT_DOMAIN" ]; then
            MSG="Purge: ${INPUT_DOMAIN} [skip ci]"
          else
            MSG="Allowlist update: clean all lists [skip ci]"
          fi

          for i in {1..5}; do
            git fetch origin main
            git reset --hard origin/main
            # A failed attempt can leave newly generated, untracked shards.
            # Clear only generator-owned trees before rebuilding from the
            # newest authoritative main branch.
            git clean -fd -- community dns rootlist

            if [ -n "$INPUT_DOMAIN" ]; then
              python - <<'PY'
          import json
          import os

          domain = os.environ["INPUT_DOMAIN"].strip().lower()
          if not domain:
              raise SystemExit("empty allowlist input")

          path = "allow/allowlist.json"
          with open(path, "r", encoding="utf-8") as source:
              data = json.load(source)
          if not isinstance(data, list) or any(not isinstance(item, str) for item in data):
              raise SystemExit("allowlist must be a JSON array of strings")

          # Merge into the freshly fetched file. Existing exact entries and
          # leading-dot suffix patterns are preserved byte-for-byte.
          if domain not in data:
              data.append(domain)
              data.sort()
              with open(path, "w", encoding="utf-8") as target:
                  json.dump(data, target, indent=2, ensure_ascii=False)
              print(f"Added '{domain}' to allowlist ({len(data)} total)")
          else:
              print(f"'{domain}' already in allowlist")
          PY
            fi

            # Regenerate from the same fresh allowlist revision that will be
            # committed. If an external writer wins the race, normal git push
            # rejects this commit and the loop rebuilds from its newer commit.
            python scripts/validate_json.py
            python scripts/validate_and_clean.py
            python scripts/json_to_txt.py
            python scripts/update_counts.py
            python scripts/build_rootlist.py
            python scripts/build_shards.py

            git add -A -- allow/allowlist.json list.json list.txt count.json \
                   community/blocklist.json community/blocklist.txt \
                   community/dead_blocklist.json \
                   community/live_blocklist.json community/live_blocklist.txt \
                   community/content_live.json community/content_live.txt \
                   community/count.json community/live_count.json \
                   community/content_active_count.json \
                   dns rootlist
            if git diff --staged --quiet; then
              echo "Changes already present in remote"
              exit 0
            fi

            git commit -m "$MSG"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          exit 1

  mirror:
    name: Mirror latest main to Codeberg
    needs: purge
    if: "needs.purge.result == 'success'"
    concurrency:
      group: codeberg-mirror
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 64
          filter: blob:none

      - name: Mirror to Codeberg
        continue-on-error: true
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "::error::CODEBERG_TOKEN is not configured"
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BRANCH="${GITHUB_REF_NAME}"
          git remote add codeberg "https://phishdestroy:${CODEBERG_TOKEN}@codeberg.org/phishdestroy/${REPO_NAME}.git"
          git push codeberg "HEAD:refs/heads/${BRANCH}"
