<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes fadein {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1;   }
        50%       { opacity: 0.2; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes scanline {
        0%   { transform: translateY(-20px); opacity: 0;   }
        5%   {                               opacity: 0.35; }
        95%  {                               opacity: 0.35; }
        100% { transform: translateY(240px); opacity: 0;   }
      }
      @keyframes arc1 { from { stroke-dashoffset: 440; } to { stroke-dashoffset: 0; } }
      @keyframes arc2 { from { stroke-dashoffset: 314; } to { stroke-dashoffset: 0; } }
      @keyframes glow {
        0%, 100% { opacity: 1;   }
        50%       { opacity: 0.7; }
      }
      @keyframes br {
        from { opacity: 0; transform: translateX(6px); }
        to   { opacity: 1; transform: translateX(0);   }
      }

      .lbl  { animation: fadein 0.7s ease  0.10s; }
      .ttl  { animation: fadein 0.7s ease  0.30s; }
      .sub  { animation: fadein 0.7s ease  0.55s; }
      .d1   { animation: pulse 2.5s ease-in-out infinite 0.0s; }
      .d2   { animation: pulse 2.5s ease-in-out infinite 0.8s; }
      .d3   { animation: pulse 2.5s ease-in-out infinite 1.6s; }
      .cur  { animation: blink 1.0s step-end   infinite; }
      .scan { animation: scanline 4s linear     infinite 1.0s; }
      .a1   { animation: arc1  2.0s ease-out    0.20s; }
      .a2   { animation: arc2  2.5s ease-out    0.50s; }
      .bar  { animation: glow  3.0s ease-in-out infinite; }

      .s0  { animation: br 0.5s ease  0.70s; }
      .s1  { animation: br 0.5s ease  0.82s; }
      .s2  { animation: br 0.5s ease  0.94s; }
      .s3  { animation: br 0.5s ease  1.06s; }
      .s4  { animation: br 0.5s ease  1.18s; }
      .s5  { animation: br 0.5s ease  1.30s; }
      .s6  { animation: br 0.5s ease  1.42s; }
      .s7  { animation: br 0.5s ease  1.54s; }
      .s8  { animation: br 0.5s ease  1.66s; }
      .s9  { animation: br 0.5s ease  1.78s; }
      .s10 { animation: br 0.5s ease  1.90s; }
      .s11 { animation: br 0.5s ease  2.02s; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#030810"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="rp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a1628" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cp"><rect width="900" height="220" rx="8"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="8" fill="url(#bg)"/>

  <!-- Grid -->
  <g clip-path="url(#cp)" stroke="#0d1f35" stroke-width="1">
    <line x1="90"  y1="0" x2="90"  y2="220"/>
    <line x1="180" y1="0" x2="180" y2="220"/>
    <line x1="270" y1="0" x2="270" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="540" y1="0" x2="540" y2="220"/>
    <line x1="630" y1="0" x2="630" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
    <line x1="810" y1="0" x2="810" y2="220"/>
    <line x1="0" y1="55"  x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <!-- Right panel subtle tint -->
  <rect x="510" y="0" width="390" height="220" fill="url(#rp)" clip-path="url(#cp)"/>

  <!-- Divider -->
  <line x1="510" y1="20" x2="510" y2="200" stroke="#1a3050" stroke-width="1"/>

  <!-- Arcs (right panel) -->
  <g clip-path="url(#cp)">
    <circle class="a1" cx="870" cy="110" r="70" fill="none"
            stroke="#CC0000" stroke-opacity="0.18" stroke-width="1.5"
            stroke-dasharray="440" stroke-dashoffset="440"/>
    <circle class="a2" cx="870" cy="110" r="50" fill="none"
            stroke="#CC0000" stroke-opacity="0.10" stroke-width="1"
            stroke-dasharray="314" stroke-dashoffset="314"/>
  </g>

  <!-- Scanline -->
  <rect class="scan" x="0" y="-20" width="900" height="20"
        fill="url(#sg)" clip-path="url(#cp)"/>

  <!-- Red left bar -->
  <rect class="bar" x="0" y="0" width="5" height="220" fill="#CC0000"/>

  <!-- Pulse dots -->
  <circle class="d1" cx="26" cy="55"  r="3" fill="#CC0000"/>
  <circle class="d2" cx="26" cy="110" r="3" fill="#CC0000"/>
  <circle class="d3" cx="26" cy="165" r="3" fill="#CC0000"/>

  <!-- LEFT: main text -->
  <text class="lbl" x="50" y="88"
        font-family="monospace" font-size="11" fill="#CC0000" letter-spacing="4">PHISHDESTROY</text>

  <text class="ttl" x="50" y="136"
        font-family="monospace" font-size="40" font-weight="bold"
        fill="#dde8f5" letter-spacing="3">COMMUNITY</text>

  <text class="sub" x="50" y="162"
        font-family="monospace" font-size="11" fill="#3a5570"
        letter-spacing="2">AGGREGATED THREAT INTELLIGENCE FEEDS<tspan class="cur" fill="#CC0000">_</tspan></text>

  <!-- RIGHT: sources header -->
  <text class="s0" x="530" y="38"
        font-family="monospace" font-size="10" fill="#CC0000"
        letter-spacing="3">SOURCES</text>

  <!-- RIGHT: source list — column 1 (x=530), column 2 (x=720) -->
  <!-- col 1 -->
  <g font-family="monospace" font-size="11" fill="#8aaac8">
    <text class="s1"  x="530" y="65" >▸ MetaMask</text>
    <text class="s2"  x="530" y="86" >▸ ScamSniffer</text>
    <text class="s3"  x="530" y="107">▸ OpenPhish</text>
    <text class="s4"  x="530" y="128">▸ Polkadot JS</text>
    <text class="s5"  x="530" y="149">▸ SEAL</text>
    <text class="s6"  x="530" y="170">▸ Enkrypt</text>
  </g>

  <!-- col 2 -->
  <g font-family="monospace" font-size="11" fill="#8aaac8">
    <text class="s7"  x="718" y="65" >▸ SPMedia</text>
    <text class="s8"  x="718" y="86" >▸ CryptoFirewall</text>
    <text class="s9"  x="718" y="107">▸ Codeesura</text>
    <text class="s10" x="718" y="128">▸ Phishunt</text>
    <text class="s11" x="718" y="149">▸ DiscordPhishing</text>
  </g>
</svg>
